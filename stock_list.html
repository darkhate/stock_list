<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>市場即時監控</title>

  <style>
    body {
      margin: 0;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 95%;
      max-width: 1400px;
      margin: 30px auto;
    }

    h1 {
      margin-bottom: 20px;
    }

    .market-box {
      background: #18181b;
      border: 1px solid #2d3748;
      border-radius: 12px;
      overflow: hidden;
      min-height: 700px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>市場即時監控</h1>

  <div class="market-box">

    <script
      type="module"
      src="https://widgets.tradingview-widget.com/w/en/tv-market-data.js">
    </script>

    <tv-market-data
      symbol-sectors='[
        {
          "sectionName":"ETF",
          "symbols":[
            "NASDAQ:QQQ",
            "AMEX:VOO",
            "AMEX:TMF",
            "NASDAQ:TLT"
          ]
        },
        {
          "sectionName":"貴金屬",
          "symbols":[
            "OANDA:XAGUSD",
            "COMEX:GC1!"
          ]
        },
        {
          "sectionName":"期貨",
          "symbols":[
            "CME:BTC1!",
            "NYMEX:CL1!",
            "CME_MINI:NQ1!",
            "CME_MINI:ES1!"
          ]
        },
        {
          "sectionName":"總經",
          "symbols":[
            "CBOE:VIX",
            "TVC:DXY",
            "TVC:US10Y"
          ]
        }
      ]'>
    </tv-market-data>

  </div>

</div>

</body>
</html>
